<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Timer - Teacher Hernán</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f3f4f6; --text-color: #333; --card-bg: #fff; --primary: #4A90E2; --secondary: #4CAF50; }
        body.dark-mode { --bg-color: #1a1a1a; --text-color: #f3f4f6; --card-bg: #2d2d2d; }
        body { margin: 0; font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: var(--text-color); transition: all 0.3s ease; }
        .container { display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; box-sizing: border-box; }
        .teacher-name { color: var(--primary); font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .block-label { font-size: 18px; color: #777; margin: 5px 0; }
        .remaining-class { color: var(--secondary); font-size: 16px; margin-bottom: 20px; }
        .student-list { width: 100%; max-width: 400px; }
        .student-item { background: var(--card-bg); padding: 15px; margin-bottom: 10px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .current-turn { border: 2px solid var(--primary); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        .alert-up { color: #ff4d4d; font-weight: bold; margin-top: 5px; }
        .controls { margin-top: 30px; text-align: center; }
        .button-group { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        button { background: var(--primary); border: none; color: white; padding: 12px 20px; border-radius: 8px; font-size: 18px; cursor: pointer; }
        button.pip-btn { background: #6c5ce7; margin-top: 15px; font-size: 14px; }
        .welcome-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--primary); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        input[type="text"] { padding: 10px; border-radius: 5px; border: none; margin-top: 10px; width: 200px; }
        .footer { margin-top: auto; padding: 20px; color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <canvas id="pip-canvas" width="300" height="150" style="display:none;"></canvas>
    <video id="pip-video" autoplay muted playsinline style="display:none;"></video>

    <script type="text/babel"data-type="module">
        const { useState, useEffect, useMemo } = React;

        const WEEKDAY_BLOCKS = [
            { label: "6:05 am - 7:25 am", start: 6 * 60 + 5, end: 7 * 60 + 25 },
            { label: "7:35 am - 8:55 am", start: 7 * 60 + 35, end: 8 * 60 + 55 },
            { label: "9:05 am - 10:25 am", start: 9 * 60 + 5, end: 10 * 60 + 25 },
            { label: "10:35 am - 11:55 am", start: 10 * 60 + 35, end: 11 * 60 + 55 },
            { label: "12:05 pm - 1:25 pm", start: 12 * 60 + 5, end: 13 * 60 + 25 },
            { label: "1:35 pm - 2:55 pm", start: 13 * 60 + 35, end: 14 * 60 + 55 },
            { label: "3:05 pm - 4:25 pm", start: 15 * 60 + 5, end: 16 * 60 + 25 },
            { label: "4:35 pm - 5:55 pm", start: 16 * 60 + 35, end: 17 * 60 + 55 },
            { label: "6:05 pm - 7:25 pm", start: 18 * 60 + 5, end: 19 * 60 + 25 },
            { label: "7:35 pm - 8:55 pm", start: 19 * 60 + 35, end: 20 * 60 + 55 },
        ];

        const SATURDAY_BLOCKS = [
            { label: "8:05 am - 9:25 am", start: 8 * 60 + 5, end: 9 * 60 + 25 },
            { label: "9:35 am - 10:55 am", start: 9 * 60 + 35, end: 10 * 60 + 55 },
            { label: "11:05 am - 12:25 pm", start: 11 * 60 + 5, end: 12 * 60 + 25 },
            { label: "1:05 pm - 2:25 pm", start: 13 * 60 + 5, end: 14 * 60 + 25 },
            { label: "2:35 pm - 3:55 pm", start: 14 * 60 + 35, end: 15 * 60 + 55 }
        ];

        const App = () => {
            const [numStudents, setNumStudents] = useState(() => JSON.parse(localStorage.getItem('numStudents')) || 1);
            const [teacherName, setTeacherName] = useState(() => localStorage.getItem('teacherName') || '');
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    setCurrentTime(now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60);
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                localStorage.setItem('numStudents', numStudents);
                localStorage.setItem('teacherName', teacherName);
                document.body.className = isDarkMode ? 'dark-mode' : '';
            }, [numStudents, teacherName, isDarkMode]);

            const currentBlock = useMemo(() => {
                const day = new Date().getDay();
                const blocks = day === 6 ? SATURDAY_BLOCKS : WEEKDAY_BLOCKS;
                return blocks.find(b => currentTime >= b.start && currentTime < b.end);
            }, [currentTime]);

            const formatTime = (timeInMinutes) => {
                const mins = Math.floor(Math.max(0, timeInMinutes));
                const secs = Math.round((timeInMinutes - mins) * 60);
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            };

            const isAttendanceTime = useMemo(() => {
                if (!currentBlock) return false;
                const minutesSinceStart = currentTime - currentBlock.start;
                // Se activa desde el minuto 15 hasta el 17 para dar margen de aviso
                return minutesSinceStart >= 15 && minutesSinceStart <= 17;
            }, [currentBlock, currentTime]);

            const studentsData = useMemo(() => {
                if (!currentBlock) return [];
                const studentTime = (currentBlock.end - currentBlock.start) / numStudents;
                return Array.from({ length: numStudents }).map((_, i) => {
                    const start = currentBlock.start + (i * studentTime);
                    const end = start + studentTime;
                    let remaining = 0;
                    if (currentTime < start) remaining = studentTime;
                    else if (currentTime < end) remaining = end - currentTime;
                    return { index: i + 1, remaining, active: currentTime >= start && currentTime < end };
                });
            }, [currentBlock, numStudents, currentTime]);

            const activeStudent = studentsData.find(s => s.active);

            // Dibujar en el Canvas con alerta de asistencia
            useEffect(() => {
                const canvas = document.getElementById('pip-canvas');
                const ctx = canvas.getContext('2d');
                
                // Si es hora de la falla, fondo rojo parpadeante (usando segundos para el efecto)
                if (isAttendanceTime && Math.floor(currentTime * 60) % 2 === 0) {
                    ctx.fillStyle = '#FF0000';
                } else {
                    ctx.fillStyle = '#000000';
                }
                
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                if (isAttendanceTime) {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = 'bold 35px Arial';
                    ctx.fillText("¡Marca la falla!", canvas.width/2, canvas.height/2);
                } else if (activeStudent) {
                    ctx.fillStyle = '#00FF00';
                    ctx.font = 'bold 90px Courier New, monospace';
                    ctx.fillText(formatTime(activeStudent.remaining), canvas.width/2, canvas.height/2);
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '30px Arial';
                    ctx.fillText("Class Timer", canvas.width/2, canvas.height/2);
                }
            }, [activeStudent, isAttendanceTime, currentTime]);

            const togglePiP = async () => {
                const video = document.getElementById('pip-video');
                const canvas = document.getElementById('pip-canvas');
                try {
                    if (document.pictureInPictureElement) {
                        await document.exitPictureInPicture();
                    } else {
                        const stream = canvas.captureStream(15);
                        video.srcObject = stream;
                        video.onloadedmetadata = async () => {
                            await video.play();
                            await video.requestPictureInPicture();
                        };
                    }
                } catch (e) { console.error(e); }
            };

            if (!teacherName) {
                return (
                    <div className="welcome-screen">
                        <h1>Welcome Teacher!</h1>
                        <input type="text" placeholder="Enter your name" onKeyDown={(e) => e.key === 'Enter' && setTeacherName(e.target.value)} />
                        <p>Press Enter to start</p>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="header-tools">
                        <label><input type="checkbox" onChange={() => setIsDarkMode(!isDarkMode)} /> Dark Mode</label>
                    </div>
                    <div className="teacher-name">Teacher: {teacherName}</div>
                    {currentBlock ? (
                        <>
                            <div className="block-label">Block: {currentBlock.label}</div>
                            <div className="remaining-class">Class Ends: {formatTime(currentBlock.end - currentTime)}</div>
                            <button className="pip-btn" onClick={togglePiP}>📱 Enable Floating Timer</button>
                            {isAttendanceTime && <div style={{color: 'red', fontWeight: 'bold', marginTop: '10px'}}>⚠️ ¡ES HORA DE MARCAR LA FALLA!</div>}
                            <div className="student-list" style={{marginTop:'20px'}}>
                                {studentsData.map((s, i) => (
                                    <div key={i} className={`student-item ${s.active ? 'current-turn' : ''}`}>
                                        <strong>Student {s.index}</strong><br/>
                                        {formatTime(s.remaining)} remaining
                                        {s.remaining <= 0 && currentTime > currentBlock.start && <div className="alert-up">Time's up!</div>}
                                    </div>
                                ))}
                            </div>
                        </>
                    ) : (
                        <div style={{margin: '40px 0'}}>No class active</div>
                    )}
                    <div className="controls">
                        <div>Students: {numStudents}</div>
                        <div className="button-group">
                            <button onClick={() => setNumStudents(Math.max(1, numStudents - 1))}>-</button>
                            <button onClick={() => setNumStudents(Math.min(10, numStudents + 1))}>+</button>
                        </div>
                    </div>
                    <div className="footer">Created by Teacher Hernán Camilo</div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
