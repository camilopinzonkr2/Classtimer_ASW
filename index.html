<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Timer - Teacher Hernán</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f3f4f6; --text-color: #333; --card-bg: #fff; --primary: #4A90E2; --secondary: #4CAF50; }
        body.dark-mode { --bg-color: #1a1a1a; --text-color: #f3f4f6; --card-bg: #2d2d2d; }
        body { margin: 0; font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: var(--text-color); transition: all 0.3s ease; }
        .container { display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; box-sizing: border-box; }
        .teacher-name { color: var(--primary); font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .block-label { font-size: 18px; color: #777; margin: 5px 0; }
        .remaining-class { color: var(--secondary); font-size: 16px; margin-bottom: 20px; }
        .student-list { width: 100%; max-width: 400px; }
        .student-item { background: var(--card-bg); padding: 15px; margin-bottom: 10px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .current-turn { border: 2px solid var(--primary); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        .controls { margin-top: 30px; text-align: center; border-top: 1px solid #ddd; padding-top: 20px; width: 100%; max-width: 400px;}
        .button-group { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        button { background: var(--primary); border: none; color: white; padding: 12px 20px; border-radius: 8px; font-size: 18px; cursor: pointer; }
        .pip-button { background: #546e7a; margin-top: 15px; width: 100%; font-size: 16px; }
        .welcome-screen { position: fixed; inset: 0; background: var(--primary); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #pip-assets { position: absolute; left: -9999px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="pip-assets">
        <canvas id="pip-canvas" width="300" height="150"></canvas>
        <video id="pip-video" autoplay muted playsinline></video>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const WEEKDAY_BLOCKS = [
            { label: "6:05 am - 7:25 am", start: 365, end: 445 },
            { label: "7:35 am - 8:55 am", start: 455, end: 535 },
            { label: "9:05 am - 10:25 am", start: 545, end: 625 },
            { label: "10:35 am - 11:55 am", start: 635, end: 715 },
            { label: "12:05 pm - 1:25 pm", start: 725, end: 805 },
            { label: "1:35 pm - 2:55 pm", start: 815, end: 895 },
            { label: "3:05 pm - 4:25 pm", start: 905, end: 985 },
            { label: "4:35 pm - 5:55 pm", start: 995, end: 1075 },
            { label: "6:05 pm - 7:25 pm", start: 1085, end: 1165 },
            { label: "7:35 pm - 8:55 pm", start: 1175, end: 1255 }
        ];

        const App = () => {
            const [numStudents, setNumStudents] = useState(() => JSON.parse(localStorage.getItem('numStudents')) || 1);
            const [teacherName, setTeacherName] = useState(() => localStorage.getItem('teacherName') || '');
            const [currentTime, setCurrentTime] = useState(0);

            useEffect(() => {
                const update = () => {
                    const now = new Date();
                    setCurrentTime(now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60);
                };
                update();
                const timer = setInterval(update, 1000);
                return () => clearInterval(timer);
            }, []);

            const currentBlock = useMemo(() => {
                const day = new Date().getDay();
                const blocks = day === 6 ? [] : WEEKDAY_BLOCKS; // Simplificado para prueba
                return blocks.find(b => currentTime >= b.start && currentTime < b.end);
            }, [currentTime]);

            const formatTime = (timeInMinutes) => {
                const mins = Math.floor(Math.max(0, timeInMinutes));
                const secs = Math.round((timeInMinutes - mins) * 60);
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            };

            const studentsData = useMemo(() => {
                if (!currentBlock) return [];
                const studentTime = (currentBlock.end - currentBlock.start) / numStudents;
                return Array.from({ length: numStudents }).map((_, i) => {
                    const start = currentBlock.start + (i * studentTime);
                    const end = start + studentTime;
                    return { 
                        remaining: currentTime < start ? studentTime : Math.max(0, end - currentTime),
                        active: currentTime >= start && currentTime < end 
                    };
                });
            }, [currentBlock, numStudents, currentTime]);

            useEffect(() => {
                const canvas = document.getElementById('pip-canvas');
                const ctx = canvas.getContext('2d');
                const active = studentsData.find(s => s.active);
                ctx.fillStyle = "#1a1a1a";
                ctx.fillRect(0, 0, 300, 150);
                ctx.fillStyle = "#4A90E2";
                ctx.font = "bold 20px Arial";
                ctx.textAlign = "center";
                ctx.fillText(active ? "Time Remaining" : "Class Timer", 150, 40);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 60px Arial";
                ctx.fillText(active ? formatTime(active.remaining) : "00:00", 150, 110);
            }, [currentTime, studentsData]);

            const togglePiP = async () => {
                const video = document.getElementById('pip-video');
                const canvas = document.getElementById('pip-canvas');
                try {
                    if (document.pictureInPictureElement) {
                        await document.exitPictureInPicture();
                    } else {
                        video.srcObject = canvas.captureStream(10);
                        await video.play();
                        await video.requestPictureInPicture();
                    }
                } catch (e) { alert("Error: Verifica que uses Chrome/Edge y HTTPS"); }
            };

            if (!teacherName) return (
                <div className="welcome-screen">
                    <h1>Class Timer</h1>
                    <input type="text" placeholder="Tu nombre" onKeyDown={e => e.key === 'Enter' && setTeacherName(e.target.value)} />
                </div>
            );

            return (
                <div className="container">
                    <div className="teacher-name">Profesor: {teacherName}</div>
                    {currentBlock ? (
                        <>
                            <div className="block-label">{currentBlock.label}</div>
                            <div className="student-list">
                                {studentsData.map((s, i) => (
                                    <div key={i} className={`student-item ${s.active ? 'current-turn' : ''}`}>
                                        <strong>Estudiante {i + 1}</strong><br/>
                                        {formatTime(s.remaining)}
                                    </div>
                                ))}
                            </div>
                        </>
                    ) : <div style={{margin:'20px'}}>Fuera de horario de clase</div>}
                    
                    <div className="controls">
                        <div>Estudiantes: {numStudents}</div>
                        <div className="button-group">
                            <button onClick={() => setNumStudents(Math.max(1, numStudents - 1))}>-</button>
                            <button onClick={() => setNumStudents(Math.min(10, numStudents + 1))}>+</button>
                        </div>
                        <button className="pip-button" onClick={togglePiP}>📺 ACTIVAR VENTANA FLOTANTE</button>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
